<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ferramentas 3D</title>
<style>
:root{--bg:#ECEFF1;--panel:#fff;--ink:#16212B;--muted:#5A6772;--line:#D3DADF;--accent:#0E7466;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1418;--panel:#162027;--ink:#E4EAEE;--muted:#93A2AC;--line:#283540;--accent:#3EC0AA;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 20px}
h1{font-size:28px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
a.card h2{margin:0 0 4px;font-size:18px;color:var(--accent)}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Ferramentas 3D</h1>
<p class="sub">Utilitários para impressão 3D</p>
<a class="card" href="/stl/"><h2>Reparador de STL</h2><span>Abrir, inspecionar e corrigir malhas STL</span></a>
<a class="card" href="/gcode/"><h2>Reparador de G-code</h2><span>Corrigir arquivos G-code</span></a>
</main>
</body>
</html>
